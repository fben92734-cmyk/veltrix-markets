services:
  - type: web
    name: veltrix-markets-demo
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/csrf
    disk:
      name: veltrix-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_FILE
        value: /var/data/veltrix.sqlite
      - key: DATA_DIR
        value: /var/data
